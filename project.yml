name: WHOXOS
packages:
  WHOXCore:
    path: .
options:
  bundleIdPrefix: com.whox
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  WHOXOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/WHOXOS
    dependencies:
      - package: WHOXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whox.whoxos
        PRODUCT_NAME: WHOX OS
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 13
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/WHOXOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 8PN4T7SR2G
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: WHOX OS App Store
    scheme:
      testTargets: []
