workflows:
  testflight:
    name: WHOX OS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: review/polished-gateway-ui
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: whox-app-store
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.whox.whoxos
      vars:
        XCODE_SCHEME: WHOXOS
        APP_STORE_APPLE_ID: "6795136394"
        BUILD_NUMBER_OFFSET: "12"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Verify portable core
        script: swift test
      - name: Set build number and generate project
        script: |
          python3 -c 'import os, pathlib, re; p=pathlib.Path("project.yml"); s=p.read_text(); n=int(os.environ["CM_BUILD_NUMBER"])+int(os.environ["BUILD_NUMBER_OFFSET"]); p.write_text(re.sub(r"CURRENT_PROJECT_VERSION: \\d+", f"CURRENT_PROJECT_VERSION: {n}", s))'
          xcodegen generate --spec project.yml
      - name: Install signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/WHOXOS.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - WHOX Internal
